[build]
  command = "node scripts/assemble-static-preview.mjs && cp -a site-static/. public/ && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Le runtime Next reste exigé par le plugin du site. Ces règles, plus spécifiques,
# servent les fichiers du site statique (production + deux guides) avant le handler Next.
[[redirects]]
  from = "/fr/espace-pro"
  to = "/fr/professionnels/"
  status = 301

