[build]
  command = "cp -a site-static/. public/ && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Réécritures vers les fichiers du miroir statique. Les règles plus spécifiques
# précèdent le handler Next. Pas de règle qui réécrit index.html vers lui-même.
[[redirects]]
  from = "/fr/espace-pro"
  to = "/fr/professionnels/"
  status = 301

