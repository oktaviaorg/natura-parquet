<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Points de contrôle avant prescription d’un parquet en local professionnel</title><desc id="desc">Schéma éditorial générique, non coté : quatre contrôles à documenter sur la référence et le chantier.</desc><rect width="1200" height="760" rx="32" fill="#f7f4ed"/><text x="65" y="92" fill="#253527" font-family="Arial, sans-serif" font-size="38" font-weight="700">Contrôles avant prescription</text><text x="65" y="132" fill="#40554a" font-family="Arial, sans-serif" font-size="20">Schéma de lecture — aucune performance produit n’est certifiée ici</text><g font-family="Arial, sans-serif" fill="#253527"><rect x="62" y="177" width="520" height="210" rx="18" fill="#fff" stroke="#aec6ac" stroke-width="3"/><text x="90" y="226" font-size="26" font-weight="700">01 · Lame identifiée</text><text x="90" y="272" font-size="21">Nom commercial, construction, dimensions</text><text x="90" y="306" font-size="21">et finition de la référence livrable.</text><text x="90" y="350" font-size="19" fill="#5c6b5b">→ Vérifier la fiche de la référence exacte.</text><rect x="618" y="177" width="520" height="210" rx="18" fill="#fff" stroke="#aec6ac" stroke-width="3"/><text x="646" y="226" font-size="26" font-weight="700">02 · Usage documenté</text><text x="646" y="272" font-size="21">Classe ou performance annoncée :</text><text x="646" y="306" font-size="21">demander le justificatif et sa portée.</text><text x="646" y="350" font-size="19" fill="#5c6b5b">→ Ne pas déduire l’usage d’une photo.</text><rect x="62" y="417" width="520" height="210" rx="18" fill="#fff" stroke="#aec6ac" stroke-width="3"/><text x="90" y="466" font-size="26" font-weight="700">03 · Support et pose</text><text x="90" y="512" font-size="21">Humidité, planéité et notice de pose</text><text x="90" y="546" font-size="21">pour le chantier concerné.</text><text x="90" y="590" font-size="19" fill="#5c6b5b">→ Validation par le professionnel.</text><rect x="618" y="417" width="520" height="210" rx="18" fill="#fff" stroke="#aec6ac" stroke-width="3"/><text x="646" y="466" font-size="26" font-weight="700">04 · Exploitation</text><text x="646" y="512" font-size="21">Trafic, nettoyage, entrées, mobilier</text><text x="646" y="546" font-size="21">et entretien prévisible.</text><text x="646" y="590" font-size="19" fill="#5c6b5b">→ Confronter au cahier des charges.</text></g><text x="65" y="695" font-family="Arial, sans-serif" fill="#566254" font-size="20">Illustration originale Natura Parquet · outil de dialogue, non rapport d’essai</text></svg>